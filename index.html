<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>കഥാസാഗരം</title>
    <style>
        /* [Existing CSS preserved for consistency] */
        :root { --primary: #4a7c59; --admin-color: #2b4c7e; --dev-color: #7b2cbf; --danger: #c93b3b; --input-bg: #fafafa; --border: #dddddd; }
        body { font-family: sans-serif; background: #ffffff; color: #333; margin: 0; padding: 0 0 80px 0; }
        .container { max-width: 800px; margin: 0 auto; padding: 0 20px; }
        .plain-section { background: transparent; padding: 20px; border: 1px solid #ddd; margin-bottom: 20px; border-radius: 8px; }
        .hidden { display: none !important; }
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .fullscreen-manual-view { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: white; z-index: 1000000; overflow-y: auto; padding: 30px; }
    </style>
</head>
<body>

<div id="fullscreenManualOverlay" class="fullscreen-manual-view hidden">
    <div class="manual-wrapper-box">
        <div class="manual-header-row">
            <h2 id="manualHeadingTarget" class="manual-title">📚 Documentation Canvas</h2>
            <button type="button" id="manualCloseBtn" class="manual-close-trigger">✕ Close</button>
        </div>
        <div id="manualContentContainer"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs, deleteDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    // ... (All initialization logic remains same as previous version)

    // REVISED SUBMISSION ENGINE
    ratingForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const activeStorySelection = storyDropdown.value;
        const name = friendNameInput.value.trim();
        const score = parseInt(ratingValueInput.value);
        const guess = authorGuessInput.value.trim() || "None";
        const customTitle = titleSuggestionInput.value.trim() || "None";

        // Logic: Get Story Date
        const storyData = arrayedStoriesList.find(s => s.id === activeStorySelection);
        const isToday = storyData && new Date(storyData.created).toDateString() === new Date().toDateString();
        const now = new Date();
        const currentHour = now.getHours();

        // Lockdown Check
        if (!isToday) {
            customAlert("Submissions are locked: This story was published on a previous day.");
            return;
        }
        if (currentHour >= 18) {
            customAlert("Submissions are locked: The 18:00 IST cutoff has passed.");
            return;
        }

        // Logic: Check existing submission for Name
        const docSnap = await getDoc(doc(db, "competitions", activeStorySelection));
        const existingData = docSnap.exists() ? docSnap.data() : {};
        
        if (existingData[name] && existingData[name].score && score !== existingData[name].score) {
            customAlert("You have already rated this story; scores cannot be changed.");
            return;
        }

        try {
            await setDoc(doc(db, "competitions", activeStorySelection), {
                [name]: {
                    score: score,
                    authorGuess: guess,
                    suggestedTitle: customTitle
                }
            }, { merge: true });
            customAlert("Review saved successfully.");
        } catch (err) {
            customAlert("Sync error.");
        }
    });

    // REVISED AUTO-FILL LOGIC
    function autoFillPreviousUserInputs() {
        const targetStory = storyDropdown.value;
        const name = friendNameInput.value.trim();
        
        // Fetch specific doc to see if user has entry
        getDoc(doc(db, "competitions", targetStory)).then(docSnap => {
            if (docSnap.exists() && docSnap.data()[name]) {
                const data = docSnap.data()[name];
                ratingValueInput.value = data.score || "";
                authorGuessInput.value = data.authorGuess !== "None" ? data.authorGuess : "";
                titleSuggestionInput.value = data.suggestedTitle !== "None" ? data.suggestedTitle : "";
            }
        });
    }

    // [New: Logic for moderator timing inputs is handled in saveGlobalMetaBtn listener]
</script>
</body>
</html>
